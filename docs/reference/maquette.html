<script>const weeks=[
 {name:'Les premiers traits',subtitle:'Rencontrer le papier, la couleur et l’eau.',motto:'Même les ours commencent par un trait.',tag:'La découverte',goal:'Prendre confiance avec les feutres, essayer les effets de l’eau et réaliser une première petite image.',materials:['Feutres aquarellables','Papier aquarelle','Pinceau et eau','Chiffon'],cover:'strokes'},
 {name:'L’œil de l’artiste',subtitle:'Observer les formes avant de dessiner.',motto:'Une tasse n’est jamais qu’un ovale avec de l’ambition.',tag:'L’observation',goal:'Comprendre comment décomposer un objet en formes simples, sans chercher la perfection.',materials:['Crayon HB','Gomme','Tasse','Papier à dessin'],cover:'cup'},
 {name:'L’ombre & la lumière',subtitle:'Le secret des objets qui prennent vie.',motto:'Même une pomme mérite son heure de gloire.',tag:'Le volume',goal:'Repérer la lumière, placer les zones d’ombre et suggérer le relief.',materials:['Crayon HB','Pomme','Lampe','Feutres aquarellables'],cover:'apple'},
 {name:'Carnet botanique',subtitle:'Feuilles, fleurs et petites merveilles.',motto:'Une feuille ne se pressera pas pour poser.',tag:'La nature',goal:'Dessiner les gestes du vivant : courbes, tiges, feuilles et fleurs simples.',materials:['Quelques feuilles réelles','Papier aquarelle','Feutres verts','Pinceau'],cover:'botanic'},
 {name:'Les couleurs des bois',subtitle:'Dégradés, mélanges et automne.',motto:'Les arbres ont choisi leur garde-robe.',tag:'La couleur',goal:'Observer la couleur, fabriquer des dégradés et travailler les superpositions.',materials:['Feutres de plusieurs couleurs','Papier aquarelle','Palette ou assiette','Pinceau'],cover:'tree'},
 {name:'La maison dans la forêt',subtitle:'Comprendre les distances et les volumes.',motto:'Un toit de travers ? Appelons ça du charme.',tag:'La profondeur',goal:'Créer une impression de perspective avec des tailles, des chemins et une maison.',materials:['Crayon HB','Règle facultative','Gomme','Feutres aquarellables'],cover:'house'},
 {name:'Le monde en paysages',subtitle:'Faire entrer l’horizon sur le papier.',motto:'Pas besoin de randonnée pour atteindre les sommets.',tag:'Le paysage',goal:'Construire un paysage lisible en plusieurs plans puis peindre un bord de lac.',materials:['Papier aquarelle','Feutres bleus et verts','Pinceau','Chiffon'],cover:'lake'},
 {name:'La première œuvre',subtitle:'Créer un dessin vraiment personnel.',motto:'L’important n’est pas la patte ; c’est le regard.',tag:'L’autonomie',goal:'Choisir un sujet et mener un dessin à son terme en réutilisant les acquis.',materials:['Tout le matériel','Modèle ou photographie','Une belle feuille','Un peu de patience'],cover:'final'}
];
const lessons=[
 {title:'Faire connaissance avec les feutres',desc:'Des traits, quelques couleurs, un peu d’eau. Et déjà beaucoup de possibilités.',minutes:25,art:'strokes',objective:'Découvrir les gestes et observer la réaction des encres à l’eau.',steps:[['Échauffe ta main','Trace cinq lignes, cinq courbes et cinq petits cercles.'],['Crée ton nuancier','Dessine huit carrés et colore-les avec huit teintes différentes.'],['Ajoute une goutte d’eau','Dilue trois bandes de couleur avec des quantités d’eau différentes.'],['Garde tes premiers essais','Note les effets qui te plaisent et ce qui t’a surpris.']],tip:'Un pinceau légèrement humide suffit. Trop d’eau transforme le papier en éponge, pas en œuvre d’art.',youtubeSearch:'feutres aquarellables prise en main débutant français'},
 {title:'Un soleil se couche',desc:'Ton premier paysage : quelques couleurs douces et une ligne d’horizon.',minutes:30,art:'sunset',objective:'Créer une image complète à partir d’un dégradé et de silhouettes simples.',steps:[['Dessine l’horizon','Au crayon, place une ligne un peu sous le milieu de la feuille.'],['Choisis trois teintes','Pose du jaune, du rose et une touche de bleu dans le ciel.'],['Adoucis les limites','Passe doucement un pinceau humide entre les bandes.'],['Ajoute le premier plan','Une colline sombre suffit à terminer ton coucher de soleil.']],tip:'Pour ce premier paysage, laisse au moins un peu de blanc. Le papier sait très bien jouer la lumière.',youtubeSearch:'coucher soleil aquarelle débutant français facile'},
 {title:'Voir les formes cachées',desc:'Cercles, ovales, rectangles : le monde se simplifie lorsqu’on le regarde autrement.',minutes:30,art:'shapes',objective:'Décomposer les objets réels en formes géométriques simples.',steps:[['Échauffe-toi','Dessine dix cercles et dix ovales, sans règle ni compas.'],['Observe trois objets','Choisis un livre, une tasse et un fruit posés devant toi.'],['Cherche leur structure','Représente chaque objet avec deux ou trois formes.'],['Compare et ajuste','Regarde ton modèle et rectifie seulement un ou deux détails.']],tip:'Dessiner ce que l’on voit n’est pas la même chose que dessiner ce que l’on croit connaître.',youtubeSearch:'apprendre dessin formes géométriques observation débutant'},
 {title:'Une tasse, une vraie',desc:'Le premier objet du quotidien à prendre forme sous ton crayon.',minutes:30,art:'cup',objective:'Observer puis dessiner un objet simple avec ses proportions.',steps:[['Place une tasse devant toi','Choisis une tasse sobre, sous une lumière douce.'],['Pose les grandes formes','Un rectangle pour le corps, un ovale pour le bord.'],['Ajoute l’anse','Observe sa taille et le point où elle rejoint la tasse.'],['Mets en couleur','Un peu de couleur sur un côté et une ombre sous la tasse.']],tip:'L’ovale du haut est rarement un cercle parfait. C’est précisément ce qui rend la tasse crédible.',youtubeSearch:'dessiner tasse café facilement débutant français'},
 {title:'La lumière entre en scène',desc:'Avec une simple lampe, découvre ce qui donne du volume aux objets.',minutes:30,art:'sphere',objective:'Distinguer zones éclairées et ombres pour représenter le volume.',steps:[['Observe un fruit','Place-le près d’une lampe, puis cherche le côté le plus clair.'],['Repère l’ombre portée','Observe l’ombre projetée sur la table.'],['Prépare trois valeurs','Dessine trois carrés : clair, moyen et foncé.'],['Dessine une sphère','Utilise ces trois valeurs pour donner du relief à un cercle.']],tip:'Une seule source de lumière permet de comprendre beaucoup de choses. La physique fait une apparition discrète.',youtubeSearch:'dessin ombre lumière sphère débutant français'},
 {title:'La pomme qui a du relief',desc:'Premier petit dessin d’observation coloré et ombré.',minutes:35,art:'apple',objective:'Transformer une forme plate en fruit coloré avec du volume.',steps:[['Observe une vraie pomme','Regarde son contour irrégulier et sa tige.'],['Dessine sa silhouette','Fais un contour souple, sans insister sur les détails.'],['Pose les premières couleurs','Conserve une zone plus claire là où arrive la lumière.'],['Renforce les ombres','Ajoute la tige et l’ombre sous le fruit.']],tip:'Une pomme n’a pas besoin d’être ronde comme un ballon. Ses irrégularités font sa personnalité.',youtubeSearch:'dessiner pomme ombre lumière crayon débutant français'},
 {title:'Le langage des feuilles',desc:'Des lignes courbes et des silhouettes qui respirent.',minutes:30,art:'leaves',objective:'Observer les courbes des tiges et la forme des feuilles.',steps:[['Trace des tiges libres','Dix lignes courbes, lentes et souples.'],['Explore trois formes','Feuille ovale, pointue et arrondie.'],['Observe une vraie feuille','Dessine sa silhouette, puis sa nervure centrale.'],['Mets en vert','Essaye deux nuances avec un pinceau légèrement humide.']],tip:'Les feuilles d’un même arbre ne sont pas des photocopies. Tant mieux.',youtubeSearch:'dessiner feuilles arbres simples dessin botanique débutant'},
 {title:'Ma petite planche botanique',desc:'Quelques branches, une fleur et une composition à offrir.',minutes:35,art:'botanic',objective:'Créer une illustration végétale équilibrée en combinant plusieurs éléments.',steps:[['Choisis tes modèles','Une fleur et deux types de feuilles suffisent.'],['Organise la page','Place les tiges avant d’ajouter les pétales.'],['Ajoute la couleur','Des tons doux, avec quelques mélanges légers.'],['Signe ton dessin','Ajoute la date et, si tu veux, le nom des plantes.']],tip:'Tu peux laisser du blanc autour des branches. C’est un vrai choix de composition, pas un oubli.',youtubeSearch:'dessiner fleur botanique débutant feutre aquarellable'},
 {title:'L’alchimie des couleurs',desc:'Quelques expériences pour comprendre les mélanges et les transparences.',minutes:30,art:'mix',objective:'Varier l’intensité des couleurs et tester les superpositions.',steps:[['Une couleur, cinq intensités','Fabrique cinq petits carrés du plus clair au plus intense.'],['Deux couleurs se rencontrent','Mélange deux encres sur une assiette puis applique au papier.'],['Sec et humide','Compare les pigments sur une feuille sèche et légèrement humidifiée.'],['Ajoute une couche','Attends le séchage complet, puis repasse sur une petite zone.']],tip:'La couleur prend parfois sa propre initiative. C’est la partie la plus diplomatique du dessin.',youtubeSearch:'mélange couleurs dégradé feutres aquarellables débutant'},
 {title:'Un arbre en habit d’automne',desc:'Une silhouette de tronc, puis des touches d’ocre, de rouge et d’or.',minutes:35,art:'tree',objective:'Associer des textures colorées pour dessiner un arbre.',steps:[['Dessine le tronc','Une ligne qui se divise en branches irrégulières.'],['Pose le feuillage','Des touches de jaune, orange et rouille.'],['Crée quelques fondus','Humidifie certaines zones sans tout mélanger.'],['Ajoute les détails','Branches fines, racines et quelques feuilles tombées.']],tip:'Un arbre, comme un ours, a le droit d’avoir un côté un peu décoiffé.',youtubeSearch:'dessiner arbre automne aquarelle débutant français'},
 {title:'La profondeur sans migraine',desc:'Trois petites astuces pour faire reculer le paysage.',minutes:30,art:'perspective',objective:'Suggérer l’éloignement avec les tailles, les superpositions et le chemin.',steps:[['Dessine trois arbres','Le premier grand, le deuxième moyen, le dernier petit.'],['Fais disparaître un chemin','Deux bords qui se rapprochent en direction de l’horizon.'],['Fais passer un objet devant l’autre','Un arbre masque partiellement une colline.'],['Compose une petite scène','Associe ces effets dans un dessin simple.']],tip:'La perspective est une affaire de regard. Pas besoin de sortir une calculatrice.',youtubeSearch:'profondeur perspective dessin paysage débutant'},
 {title:'La maison au fond du chemin',desc:'Quelques formes et une maison de campagne apparaît.',minutes:35,art:'house',objective:'Construire une petite habitation et l’intégrer à un paysage.',steps:[['Bâtis la façade','Dessine un grand rectangle et un toit triangulaire.'],['Ouvre les fenêtres','Ajoute deux fenêtres et une porte.'],['Trace le chemin','Un chemin s’élargit progressivement vers le bas de la page.'],['Habille la scène','Un arbre, deux buissons et une palette de cinq couleurs.']],tip:'Si ton toit penche un peu, on pourra dire que c’est une ancienne maison de caractère.',video:'SB7OGUCnbMU',youtubeSearch:'maison perspective débutant dessin français'},
 {title:'Trois plans, un paysage',desc:'Du fond lointain aux herbes du premier plan.',minutes:30,art:'hills',objective:'Composer un paysage en distinguant plusieurs niveaux de profondeur.',steps:[['Dessine trois collines','Chacune recouvre légèrement celle située derrière.'],['Éloigne la plus lointaine','Une couleur claire et douce pour les formes du fond.'],['Renforce le milieu','Une teinte intermédiaire pour le deuxième plan.'],['Affirme le premier plan','Une couleur plus soutenue et quelques détails.']],tip:'Les montagnes du fond n’ont pas besoin de crier pour exister.',youtubeSearch:'aquarelle paysage trois plans profondeur débutant français'},
 {title:'Le lac au petit matin',desc:'Un ciel calme, des collines et de l’eau qui réfléchit la lumière.',minutes:35,art:'lake',objective:'Utiliser les acquis pour réaliser un paysage complet.',steps:[['Pose l’horizon','Place une ligne d’eau et les collines en arrière-plan.'],['Peins le ciel','Un dégradé très doux, en laissant de la lumière.'],['Dessine l’eau','Quelques reflets horizontaux, sans surcharger.'],['Ajoute les herbes','De petites silhouettes au premier plan donnent de la vie.']],tip:'Pour les reflets, pense « petits traits horizontaux », pas « miroir de salle de bains ».',youtubeSearch:'paysage lac reflet aquarelle facile débutant français'},
 {title:'Choisir son sujet',desc:'Une photo, un souvenir, un lieu : ce dessin sera le tien.',minutes:30,art:'sketch',objective:'Imaginer une réalisation personnelle et préparer une composition.',steps:[['Choisis un sujet','Un objet, une maison ou un paysage que tu aimes.'],['Observe sa silhouette','Cherche les formes importantes, pas les détails.'],['Fais deux mini-croquis','Deux petits essais rapides pour cadrer ta future œuvre.'],['Prépare tes couleurs','Garde une palette de quatre à six teintes.']],tip:'Le meilleur sujet, c’est souvent celui auquel tu as envie de revenir.',youtubeSearch:'composition croquis préparatoire paysage simplifier débutant'},
 {title:'Ton premier tableau',desc:'Une œuvre entière, sans recette imposée et sans jury à impressionner.',minutes:40,art:'final',objective:'Dessiner et colorer une image personnelle en autonomie.',steps:[['Reprends ton esquisse','Reporte les grandes formes sur une belle feuille.'],['Commence par les tons clairs','Garde les parties lumineuses et travaille progressivement.'],['Ajoute les détails après séchage','Quelques accents foncés suffisent.'],['Date et signe ton œuvre','Photographie-la pour la garder dans ton carnet d’artiste.']],tip:'Si tu as envie d’en faire une deuxième, c’est gagné. Le reste est accessoire.',youtubeSearch:'faire premier paysage aquarelle débutant complet français'}
];
const LESSON_QUIZZES=[
 ['Quel geste permet de diluer une encre aquarellable ?',['Passer un pinceau légèrement humide','Utiliser une règle','Appuyer plus fort'],0,'Un peu d’eau suffit ; la pression n’est pas le bon outil.'],
 ['Comment préserver une zone très lumineuse ?',['Tout colorier','Laisser une partie du papier blanche','Rajouter du noir'],1,'Le blanc du papier devient souvent la lumière du paysage.'],
 ['Pour dessiner une tasse, on commence par…',['Les reflets','Les grandes formes','La signature'],1,'D’abord la construction ; les détails viennent ensuite.'],
 ['L’ouverture d’une tasse vue de biais ressemble plutôt à…',['Un ovale','Un carré','Un triangle'],0,'L’ellipse permet de suggérer la profondeur.'],
 ['Une ombre projetée se trouve…',['Toujours en haut','Sur la surface éclairée','Sur la surface qui reçoit l’ombre'],2,'Elle dépend de la position de la source lumineuse.'],
 ['Qu’est-ce qui donne le plus de volume à la pomme ?',['Une seule teinte uniforme','Des valeurs claires et foncées','Une ligne très épaisse'],1,'Un contraste de valeurs suffit souvent à suggérer la forme.'],
 ['Pour mieux observer une feuille, commence par…',['Sa silhouette','Ses minuscules taches','Ses nervures secondaires'],0,'La silhouette globale est une base très efficace.'],
 ['Pour rendre une planche botanique lisible…',['Remplir chaque centimètre','Laisser respirer le papier','Tout superposer'],1,'Les espaces blancs font partie de la composition.'],
 ['Pour une superposition propre des feutres…',['On laisse sécher la première couche','On frotte tant que tout est humide','On ajoute beaucoup d’eau'],0,'Le séchage permet de conserver des couches distinctes.'],
 ['Comment représenter un feuillage varié ?',['Une forme identique répétée','Différentes tailles et valeurs','De grandes lignes droites'],1,'Une variation de gestes et de valeurs donne de la vie.'],
 ['Dans un paysage, un objet éloigné semble souvent…',['Plus petit','Plus grand','Toujours aussi grand'],0,'La taille apparente participe à la perception de la profondeur.'],
 ['Pour bâtir la façade d’une maison simple…',['Commencer par chaque tuile','Un rectangle et un triangle suffisent','Dessiner d’abord le ciel'],1,'De grandes formes rendent le sujet plus facile.'],

 ['Avant une œuvre personnelle, il vaut mieux…',['Prévoir deux compositions rapides','Commencer les détails','Tout improviser sans observation'],0,'Deux mini-croquis permettent de choisir un cadrage.'],
 ['Pour finir ton dessin, tu peux…',['Forcer tous les contrastes','Revenir observer l’ensemble','Effacer tout le premier plan'],1,'Prendre de la distance évite d’ajouter des détails superflus.']

 <div class="section-head" style="margin-bottom:9px"><h2>La note de Maman Chouette</h2></div><div class="home-bottom"><p class="subtle" style="margin:0;max-width:600px">« Le secret des couleurs ? Ne pas insister quand le papier te demande de le laisser sécher. »</p><button class="textbutton" onclick="askAbout(${n})">Lui poser une question ↗</button></div>

function program(){const filters=[['all','Toutes les semaines'],['todo','À découvrir'],['done','Terminées']];
 frame(`<div class="page-heading"><div><span class="p-eyebrow">Le parcours de Papa Ours</span><h1 class="page-title">Huit semaines, une belle habitude.</h1><p class="deck" style="margin:0">Seize séances de dessin. Avance à ton rythme et ouvre simplement le chapitre qui t’intéresse.</p></div>${mark()}</div>
 <div class="tabbuttons">${filters.map(([key,label])=>`<button class="${programFilter===key?'on':''}" onclick="filterProgram('${key}')">${label}</button>`).join('')}</div>
 <div class="chapter-list">${weeks.map((week,i)=>{const c=[0,1].filter(k=>state.completed[2*i+k]).length;if(programFilter==='done'&&c<2||programFilter==='todo'&&c===2)return '';return `<div class="chapter paper ${openWeek===i?'expanded':''}" id="ch${i}"><button class="chapter-head" onclick="toggleWeek(${i})" aria-expanded="${openWeek===i}">${photo(PHOTO_WEEK[i],'chapter-photo',week.name)}<div class="chapter-copy"><span class="p-eyebrow">Semaine ${String(i+1).padStart(2,'0')}</span><h2>${safe(week.name)}</h2><p>${safe(week.subtitle)}</p></div><div class="chapter-state"><span class="hide-mobile">${c===2?'Terminé':c===0?'À découvrir':c+'/2 effectuées'}</span><span class="pill ${c===2?'':'ochre'}">${c}/2</span><span class="chapter-arrow">›</span></div></button><div class="chapter-lessons">${[0,1].map(j=>{let idx=2*i+j,l=lessons[idx];return `<button class="lesson-row" onclick="go('cours/${idx}')"><span class="round-num ${state.completed[idx]?'done':''}">${state.completed[idx]?'✓':idx+1}</span><span><strong>${safe(l.title)}</strong><small>${l.minutes} minutes · ${state.completed[idx]?'Terminée':idx===nextLesson()?'En cours':'À faire'}</small></span><span class="row-end">Ouvrir ↗</span></button>`}).join('')}</div></div>`}).join('')}</div>
 <div class="bonus-note"><div><span class="p-eyebrow">Hors programme · Bonus naturaliste</span><h3>L’ours et la chouette posent pour toi.</h3><p>Deux modèles photographiques et une feuille virtuelle pour s’entraîner à leur silhouette.</p></div><button class="button ghost" onclick="go('studio')">Ouvrir le studio ↗</button></div>`)
}
function toggleWeek(i){openWeek=openWeek===i?-1:i;program()}
function filterProgram(s){programFilter=s;openWeek=s==='done'?3:s==='todo'?4:openWeek;program()}
function lessonPage(idx){if(!Number.isInteger(idx)||idx<0||idx>15){go('cours');return;}activeLesson=idx;activePhase=state.phase?.[idx]|| (state.completed[idx]?'finish':'observe');taskNum=Number.isInteger(state.steps?.[idx])?state.steps[idx]:0;renderLesson()}
function renderLesson(){const l=lessons[activeLesson],i=activeLesson,week=weeks[weekOf(i)];
 frame(`<div class="lesson-top"><button class="back" onclick="go('cours')">← Toutes les semaines</button><div class="row wrap"><span class="p-eyebrow">Semaine ${weekOf(i)+1} · Leçon ${i+1} / 16</span>${state.completed[i]?'<span class="pill">✓ Terminée</span>':'<span class="pill ochre">À ton rythme</span>'}</div><h1 class="page-title">${safe(l.title)}</h1><div class="lesson-tools"><span>◷ ${l.minutes} min</span><span>·</span><span>${safe(week.tag)}</span><span>·</span><span>${safe(l.objective)}</span></div></div>
 <div class="lesson-stage"><div class="lesson-main"><div class="phase-nav" role="tablist" aria-label="Étapes de la séance">${[['observe','Regarder'],['draw','Dessiner'],['finish','Terminer']].map(([id,label],n)=>`<button class="phase-btn ${activePhase===id?'active':''}" role="tab" aria-selected="${activePhase===id}" onclick="switchPhase('${id}')"><span class="phase-index">${n+1}.</span>${label}</button>`).join('')}</div><div id="lessonPhase"></div></div>
 <aside class="side-quiet"><span class="p-eyebrow">Le coin de la chouette</span>${photo(bird[weekOf(i)%4],'mini-photo','Maman Chouette observe')}<h3>Une question ?</h3><p>Un petit doute sur les formes ou les couleurs ? Maman Chouette connaît la séance que tu fais.</p><button class="textbutton" onclick="askAbout(${i})">Lui demander de l’aide ↗</button><details class="dropdown"><summary>Le matériel de la semaine</summary><ul>${week.materials.map(x=>`<li>${safe(x)}</li>`).join('')}</ul></details><details class="dropdown"><summary>Mes notes</summary><textarea class="simple-textarea" id="note" placeholder="Une remarque pour plus tard…" oninput="saveNote(${i},this.value)">${safe(state.notes[i]||'')}</textarea></details></aside></div>`);
 renderPhase();
}
function switchPhase(phase){activePhase=phase;state.phase[activeLesson]=phase;persist();renderLesson()}
function renderPhase(){const l=lessons[activeLesson],i=activeLesson,el=$('#lessonPhase');if(!el)return;
 if(activePhase==='observe'){
 const watch=l.video?`<button class="play-overlay" onclick="playVideo('${safe(l.video)}')" aria-label="Lire la vidéo">▶</button>`:`<button class="play-overlay" onclick="openSearch(${i})" aria-label="Voir les tutoriels YouTube disponibles">▶</button>`;
 el.innerHTML=`<div class="content-sheet"><span class="p-eyebrow">01 · Prendre le temps d’observer</span><h2>Regarde, puis essaie.</h2><p>${safe(l.desc)} Prends le temps de regarder le mouvement avant de reproduire le geste.</p><div class="video-frame" id="videoFrame">${photo(PHOTO_LESSON[i],'','Photographie animalière accompagnant le cours')}${watch}</div><p class="small subtle">${l.video?'Vidéo YouTube intégrée.':'Vidéo à sélectionner pour la version finale ; le bouton ouvre des tutoriels correspondant à ce cours.'}</p><details class="dropdown"><summary>Préparer le matériel</summary><p>${weeks[weekOf(i)].materials.map(safe).join(' · ')}</p></details><div class="lesson-foot"><button class="button plain" onclick="go('cours')">← Le programme</button><button class="button primary" onclick="switchPhase('draw')">Passer à la pratique →</button></div></div>`;
 }else if(activePhase==='draw'){
 const step=l.steps[Math.min(taskNum,3)];el.innerHTML=`<div class="content-sheet"><span class="p-eyebrow">02 · À toi de jouer</span><div class="task-progress">${[0,1,2,3].map(j=>`<span class="${j<=taskNum?'on':''}"></span>`).join('')}</div><div class="task-area"><span class="task-number">GESTE ${taskNum+1} SUR 4</span><h2>${safe(step[0])}</h2><p>${safe(step[1])}</p></div><details class="dropdown"><summary>✳ Un indice de Maman Chouette</summary><p>${safe(l.tip)}</p><button class="textbutton" onclick="askAbout(${i})">J’ai encore une question ↗</button></details><details class="dropdown"><summary>◷ Un petit chronomètre ?</summary><p>Il sert seulement si tu en as envie ; pas de limite de temps.</p><div class="row"><strong style="font-family:var(--serif);font-size:27px" id="timer">${formatTime(remaining)}</strong><button class="button ghost small" onclick="toggleTimer()" id="timerBtn">${timer?'Pause':'Démarrer'}</button><button class="textbutton" onclick="resetTimer()">Remettre à zéro</button></div></details><div class="lesson-foot"><button class="button plain" onclick="${taskNum?'changeTask(-1)':'switchPhase(\'observe\')'}">← Précédent</button><button class="button primary" onclick="${taskNum===3?"switchPhase('finish')":"changeTask(1)"}">${taskNum===3?'Terminer le dessin':'Étape suivante'} →</button></div></div>`;
 }else{
 const quiz=LESSON_QUIZZES[i],v=state.checkins?.[i]||{},q=state.quiz?.[i];el.innerHTML=`<div class="content-sheet"><span class="p-eyebrow">03 · Garder une trace</span><h2>${state.completed[i]?'Tu peux être fier de cette page.':'Et voilà pour aujourd’hui.'}</h2><p>Le dessin est sur le papier, et c’est là que ça compte. Si tu veux, conserve une photo et une petite impression de ta séance.</p>
 <label class="upload">📷 Ajouter une photo à mon carnet <small>Facultatif, JPG ou PNG. Ton image restera dans ce navigateur.</small><input type="file" accept="image/*" onchange="lessonPhoto(this,${i})"></label>
 ${state.uploaded?.[i]?`<img class="summary-photo" alt="Dessin ajouté" src="${state.uploaded[i]}">`:''}
 <div class="form-row"><label>Comment as-tu trouvé cette séance ?</label><div class="select-pills">${['Un peu difficile','Ça allait','Plutôt facile'].map(s=>`<button class="choice ${v.ease===s?'chosen':''}" onclick="setCheckin(${i},'ease','${s}')">${s}</button>`).join('')}</div></div>
 <div class="form-row"><label>As-tu pris plaisir à dessiner ?</label><div class="select-pills">${['Pas trop','Un peu','Beaucoup'].map(s=>`<button class="choice ${v.joy===s?'chosen':''}" onclick="setCheckin(${i},'joy','${s}')">${s}</button>`).join('')}</div></div>
 <details class="dropdown"><summary>Une question pour vérifier ce que tu as retenu (facultatif)</summary><div class="quiz"><h3>${safe(quiz[0])}</h3>${quiz[1].map((s,j)=>`<label><input type="radio" name="quiz" value="${j}" ${q===j?'checked':''} onchange="answerQuiz(${i},${j})"> ${safe(s)}</label>`).join('')}${q!==undefined?`<div class="check-feedback">${q===quiz[2]?'✓ Exact. ':'Ce n’est pas tout à fait ça. '}${safe(quiz[3])}</div>`:''}</div></details>
 <div class="lesson-foot"><button class="button plain" onclick="switchPhase('draw')">← Mon dessin</button><button class="button primary" onclick="finishLesson(${i})">${state.completed[i]?'Enregistrer mon bilan':'J’ai terminé ma leçon'} ✓</button></div></div>`;
 }
}
function openSearch(i){window.open('https://www.youtube.com/results?search_query='+encodeURIComponent(lessons[i].youtubeSearch),'_blank','noopener,noreferrer')}
function playVideo(video){$('#videoFrame').innerHTML=`<iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(video)}?autoplay=1" allow="autoplay;encrypted-media;picture-in-picture" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen title="Démonstration YouTube"></iframe>`}
function changeTask(delta){taskNum=Math.max(0,Math.min(3,taskNum+delta));state.steps[activeLesson]=taskNum;persist();renderPhase()}
function saveNote(i,v){state.notes[i]=v;persist()}
function formatTime(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function toggleTimer(){if(timer){clearInterval(timer);timer=null}else{timer=setInterval(()=>{remaining++;const el=$('#timer');if(el)el.textContent=formatTime(remaining)},1000)}let b=$('#timerBtn');if(b)b.textContent=timer?'Pause':'Démarrer'}
function resetTimer(){clearInterval(timer);timer=null;remaining=0;let e=$('#timer');if(e)e.textContent='00:00';let b=$('#timerBtn');if(b)b.textContent='Démarrer'}
function setCheckin(i,k,v){state.checkins[i]={...(state.checkins[i]||{}),[k]:v};persist();renderPhase()}
function answerQuiz(i,v){state.quiz[i]=v;persist();renderPhase()}
function finishLesson(i){state.completed[i]=true;persist();toast('La séance est enregistrée dans ton carnet.');const n=i===15?15:i+1;go('cours/'+n)}
function compressImage(file,cb){if(!file||!file.type.startsWith('image/')){toast('Choisis une photographie JPG, PNG ou WebP.');return}const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const factor=Math.min(1,1000/img.width,1000/img.height),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*factor));canvas.height=Math.max(1,Math.round(img.height*factor));const c=canvas.getContext('2d');c.drawImage(img,0,0,canvas.width,canvas.height);cb(canvas.toDataURL('image/jpeg',.72))};img.src=reader.result};reader.readAsDataURL(file)}
function lessonPhoto(input,i){compressImage(input.files[0],data=>{state.uploaded[i]=data;const prev=state.works.filter(w=>w.from!==i);prev.unshift({id:'photo-'+Date.now(),title:lessons[i].title,subtitle:'Séance '+(i+1)+' · Ma réalisation',date:new Date().toLocaleDateString('fr-FR'),data,from:i});state.works=prev;persist();renderPhase();toast('Photographie ajoutée à ton carnet.')})}
function notebook(){frame(`<div class="notebook-head"><div><span class="p-eyebrow">Le carnet de Papa Ours</span><h1 class="page-title">Tes dessins, tes histoires.</h1><p class="deck" style="margin:0">Quatre créations d’exemple sont déjà dans ce carnet. Ajoute les tiennes, et regarde les premières pages avec tendresse.</p></div>${photo('chouettePortrait','','Chouette portrait')}</div>
 <div class="section-head"><h2>Mes réalisations</h2><div class="row wrap"><label class="button ghost small" style="cursor:pointer">＋ Ajouter un dessin <input type="file" accept="image/*" style="display:none" onchange="addNotebookPhoto(this)"></label><button class="button plain small" onclick="window.print()">Imprimer ↗</button></div></div>
 <div class="notebook-gallery">${state.works.map((w,j)=>`<article class="work" style="--angle:${[.3,-.65,1.1,-.8,.4][j%5]}deg"><div class="work-art">${paperWork(w)}</div><div class="work-meta"><h3>${safe(w.title)}</h3><small>${safe(w.subtitle)}</small><small>${safe(w.date)}</small>${w.sample?'<small>✳ Réalisation fictive de démonstration</small>':`<button class="textbutton small no-print" onclick="removeWork('${safe(w.id)}')">Retirer</button>`}</div></article>`).join('')}</div>
 <div class="section-head"><h2>Premier jour, aujourd’hui</h2></div><div class="panel-soft"><p class="subtle" style="margin-top:0">Une même paire d’yeux, quelques gestes en plus : le progrès se mesure aussi en regardant ses anciens dessins.</p><div class="compare-grid">${[state.works.at(-1),state.works[0]].filter(Boolean).map((w,j)=>`<div><div class="art">${paperWork(w)}</div><span class="small subtle">${j?'Dernière réalisation':'Première réalisation'}</span></div>`).join('')}</div></div>
 <div class="section-head"><h2>Mon bilan à mi-parcours</h2></div><div class="paper detail-copy"><span class="p-eyebrow">Quatre semaines sur huit</span><h3 class="subhead">Déjà huit leçons dans les pattes.</h3><p class="subtle">Tu sais maintenant tracer des formes simples, observer un objet, placer les ombres et faire vivre un dessin botanique. Il reste les couleurs, la perspective et les paysages.</p><div class="row wrap"><span class="pill">${completedCount()} / 16 leçons</span><span class="pill line">${state.works.length} dessins au carnet</span></div><details class="dropdown"><summary>Mon ressenti depuis le début</summary><div class="checkins"><div class="form-row"><label>Le plaisir de dessiner, globalement</label><div class="select-pills">${['Modéré','Bon','Excellent'].map(x=>`<button class="choice ${(state.mid?.joy||'Bon')===x?'chosen':''}" onclick="saveMid('joy','${x}')">${x}</button>`).join('')}</div></div><div class="form-row"><label>Mon aisance avec les feutres</label><div class="select-pills">${['Je découvre','Je progresse','À l’aise'].map(x=>`<button class="choice ${(state.mid?.ease||'Je progresse')===x?'chosen':''}" onclick="saveMid('ease','${x}')">${x}</button>`).join('')}</div></div></div><label class="small">Une chose que j’aimerais dessiner bientôt</label><textarea class="simple-textarea" oninput="saveMid('wish',this.value)" placeholder="Un arbre, la maison, une chouette…">${safe(state.mid?.wish||'')}</textarea></details></div>
 <div class="bonus-note"><div><h3>Un ours et une chouette à croquer</h3><p>Ouvre le petit studio naturaliste pour t’entraîner à partir d'une photographie.</p></div><button class="button primary" onclick="go('studio')">Entrer dans le studio ↗</button></div>`)}
function addNotebookPhoto(input){compressImage(input.files[0],data=>{state.works.unshift({id:'work-'+Date.now(),title:'Mon dernier dessin',subtitle:'Ajout personnel',date:new Date().toLocaleDateString('fr-FR'),data});persist();notebook();toast('Ton dessin est dans le carnet.')})}
function removeWork(id){if(confirm('Retirer cette réalisation du carnet ?')){state.works=state.works.filter(w=>w.id!==id);persist();notebook()}}
function saveMid(k,v){state.mid={...(state.mid||{}),[k]:v};persist();if(k!=='wish')notebook()}
function askAbout(i){state.aiContext=i;persist();go('chouette')}
function chatPage(){const context=Number.isInteger(state.aiContext)?state.aiContext:nextLesson();frame(`<div class="chat-hero">${photo('chouetteBranche','','La chouette dans la forêt')}<div><span class="p-eyebrow">Le bureau de la chouette</span><h1 class="page-title">Tu as une question, mon Ours ?</h1><p class="deck" style="margin:0">Une aide pour les couleurs, un geste difficile ou une photo à commenter. Ici, aucun jury.</p></div></div>
 <div class="chat-layout"><div class="paper chat-card"><div class="row between" style="padding:13px 20px;border-bottom:1px solid var(--line)"><span class="small subtle">Contexte : séance ${context+1}, ${safe(lessons[context].title)}</span><span class="pill ochre">Démo IA</span></div><div class="chatlog" id="chatlog">${state.chat.map(x=>`<div class="msg ${x.who==='user'?'user':'bot'}">${safe(x.text)}${x.img?`<img class="chat-attach" src="${x.img}" alt="Image jointe">`:''}${x.who==='bot'?'<small>Réponse simulée</small>':''}</div>`).join('')}</div><form class="chat-compose" onsubmit="sendChat(event)"><label class="icon-button" title="Joindre une photographie" style="display:grid;place-items:center;cursor:pointer">📎<input type="file" accept="image/*" style="display:none" onchange="attachChat(this)"></label><input id="chat-input" type="text" placeholder="Explique ce qui te bloque…" aria-label="Poser une question à Maman Chouette"><button class="button primary" type="submit">Envoyer ↗</button><div id="attachmentInfo" class="small subtle" style="width:100%"></div></form></div>
 <aside class="paper chat-side"><span class="p-eyebrow">Les questions fréquentes</span><h3>On peut parler de…</h3>${['Mon feutre fait des taches.','Comment réussir les dégradés ?','Comment observer les proportions ?','Peux-tu commenter mon dessin ?'].map(s=>`<button class="prompt-btn" onclick="quickAsk('${safe(s).replace(/'/g,"\\'")}')">${safe(s)} ↗</button>`).join('')}<p class="demo-label">Les réponses sont volontairement simulées. DeepSeek sera connecté lors du développement final.</p></aside></div>`);const log=$('#chatlog');if(log)log.scrollTop=log.scrollHeight;}
function attachChat(input){compressImage(input.files[0],d=>{attachedImage=d;$('#attachmentInfo').textContent='✓ Photo prête à être jointe'})}
function quickAsk(q){$('#chat-input').value=q;$('#chat-input').focus()}
function sendChat(e){e.preventDefault();let field=$('#chat-input'),text=field?.value?.trim();if(!text&&!attachedImage)return;const t=text||'Peux-tu regarder mon dessin ?';state.chat.push({who:'user',text:t,img:attachedImage});let a=t.toLowerCase(),reply='Commence par les grandes formes, puis ajoute un détail à la fois. Ne cherche pas à tout réussir du premier coup : un essai bien observé vaut plusieurs traits précipités.';
 if(attachedImage)reply='Merci pour la photo ! Dans la version finale, je pourrai analyser ton dessin réel. Pour l’instant, je te propose cette méthode : repère un point réussi, puis choisis un seul geste à ajuster lors d’un second essai.';
 else if(/couleur|dégrad|feutre|eau|tache|pinceau/.test(a))reply='Commence sur une chute de papier aquarelle. Dépose un peu de couleur, puis travaille avec le pinceau à peine humide. Laisse sécher avant de superposer : c’est souvent l’eau, pas le feutre, qui demande un peu de patience.';
 else if(/forme|ovale|proportion|tasse|objet/.test(a))reply='Cherche d’abord les deux ou trois formes les plus grandes. Garde tes traits légers et compare les largeurs avant de dessiner les détails. Un ovale imparfait peut déjà très bien raconter une tasse.';
 else if(/ombre|lumière|pomme/.test(a))reply='Choisis une source de lumière et garde une zone du papier plus claire. Place la valeur foncée du côté opposé. Tu peux déjà suggérer un beau volume avec seulement trois valeurs.';
 else if(/ours|chouette|animal/.test(a))reply='Dessine d’abord une grande masse pour le corps et une plus petite pour la tête. La silhouette doit fonctionner avant la fourrure ou les plumes. Et garde deux petits yeux attentifs pour finir le portrait.';
 state.chat.push({who:'bot',text:reply});attachedImage=null;persist();chatPage();}
function studio(){const choice=state.selectedAnimal||0;frame(`<button class="back" onclick="go('carnet')">← Mon carnet</button><span class="p-eyebrow" style="display:block">Atelier facultatif · Le bestiaire</span><h1 class="page-title">Deux sujets qui ont du caractère.</h1><p class="deck">D’abord la silhouette de l’ours ou de la chouette, ensuite les détails. Tu peux t’entraîner ici à la souris ou au doigt, ou dessiner sur ton carnet papier.</p>

 <div class="studio-layout"><div><canvas class="studio-canvas" id="studioCanvas" aria-label="Zone de dessin au doigt ou à la souris"></canvas><div class="studio-tools"><span class="small subtle">Couleur</span>${[['#3e5543','vert'],['#8e5f46','brun'],['#c77f61','rouille'],['#32332c','encre']].map(([color,name])=>`<button title="${name}" aria-label="${name}" class="swatch ${drawColor===color?'selected':''}" style="background:${color}" onclick="setBrush('${color}')"></button>`).join('')}<label class="small">Trait <input type="range" min="1" max="12" value="${drawWidth}" oninput="drawWidth=+this.value"></label><button class="button ghost small" onclick="clearCanvas()">Effacer</button><button class="button primary small" onclick="saveSketch()">Garder mon croquis ↗</button></div></div><div class="panel-soft"><span class="p-eyebrow">Fiche d’observation</span><h3 class="subhead">Une silhouette, pas un portrait-robot.</h3><p class="small subtle">1. Observe les grandes masses du corps.<br>2. Trace la direction générale.<br>3. Ajoute la tête et les proportions.<br>4. Termine avec deux ou trois détails.</p><p class="small">Le résultat n’a pas besoin d’être fidèle à la photographie. L’essentiel est de regarder avec attention.</p><button class="textbutton" onclick="askAbout(2)">Un conseil de Maman Chouette ↗</button></div></div>`);initCanvas();}
function selectAnimal(x){state.selectedAnimal=x;persist();studio()}
function initCanvas(){const canvas=$('#studioCanvas');if(!canvas)return;const r=canvas.getBoundingClientRect();canvas.width=Math.round(r.width*devicePixelRatio);canvas.height=Math.round(r.height*devicePixelRatio);drawCtx=canvas.getContext('2d');drawCtx.scale(devicePixelRatio,devicePixelRatio);drawCtx.fillStyle='#fffdf7';drawCtx.fillRect(0,0,r.width,r.height);drawCtx.lineCap='round';drawCtx.lineJoin='round';const coords=e=>{const b=canvas.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};canvas.addEventListener('pointerdown',e=>{drawActive=true;canvas.setPointerCapture(e.pointerId);const [x,y]=coords(e);drawCtx.beginPath();drawCtx.moveTo(x,y);drawCtx.strokeStyle=drawColor;drawCtx.lineWidth=drawWidth;drawCtx.lineTo(x+.1,y+.1);drawCtx.stroke()});canvas.addEventListener('pointermove',e=>{if(!drawActive)return;const [x,y]=coords(e);drawCtx.lineTo(x,y);drawCtx.stroke()});canvas.addEventListener('pointerup',()=>drawActive=false);canvas.addEventListener('pointercancel',()=>drawActive=false)}
function setBrush(c){drawColor=c;$$('.swatch').forEach(x=>x.classList.toggle('selected',x.style.background===c));}
function clearCanvas(){if(confirm('Effacer le croquis en cours ?')){const c=$('#studioCanvas');drawCtx.fillStyle='#fffdf7';drawCtx.fillRect(0,0,c.width/devicePixelRatio,c.height/devicePixelRatio)}}
function saveSketch(){const c=$('#studioCanvas');if(!c)return;state.works.unshift({id:'studio-'+Date.now(),title:state.selectedAnimal?'Étude de chouette':'Étude d’ours',subtitle:'Studio naturaliste · Mon croquis',date:new Date().toLocaleDateString('fr-FR'),data:c.toDataURL('image/jpeg',.75)});persist();toast('Ton croquis a rejoint le carnet.');go('carnet')}
function letterPage(){frame(`<button class="back" onclick="go('carnet')">← Mon carnet</button><div class="letter"><span class="p-eyebrow">Une lettre à glisser entre deux feuilles</span>${photo('oursEau','','Ours dans une rivière')}<h1 class="page-title">Pour toi, Papa.</h1><p>Il paraît que les ours aiment leur tanière. Mais celui-ci a désormais un atelier, des feutres aquarellables et une chouette qui commente les opérations.</p><p>Ces petites séances sont surtout une invitation à prendre du temps pour toi, à regarder autrement, à essayer sans te presser. Les dessins réussis seront les bienvenus ; les ratés auront également leur place.</p><p>Joyeux anniversaire, et que le carnet soit bien rempli !</p><p style="font-style:italic;margin-top:22px">Avec affection ♡</p><p class="tiny subtle">Texte de démonstration, à personnaliser avant d’offrir le cadeau.</p></div>`)}
function settings(){const html=`<div class="settings-page"><span class="p-eyebrow">Préférences de Papa Ours</span><h2 class="page-title">À ma manière.</h2><p class="subtle">Un peu de liberté, beaucoup de papier.</p>
 ${[['emails','Recevoir le courrier de l’Ours','Un message illustré quand une nouvelle semaine commence.'],['reminders','Recevoir un rappel doux','Jamais une injonction à dessiner ; juste une invitation.'],['help','Afficher les conseils de Maman Chouette','Les indices restent facultatifs dans les séances.']].map(([k,title,desc])=>`<div class="setting"><div><strong>${title}</strong><small>${desc}</small></div><button aria-pressed="${!!state.prefs[k]}" aria-label="${title}" class="toggle ${state.prefs[k]?'on':''}" onclick="setPref('${k}')"></button></div>`).join('')}
 <h3 class="subhead" style="margin-top:26px">Le courrier des huit semaines</h3>${weeks.map((w,i)=>`<div class="mail-row"><span>${i+1}</span><div style="flex:1"><strong>${safe(w.name)}</strong><small style="display:block">${safe(w.subtitle)}</small></div><button class="textbutton" onclick="previewMail(${i})">Aperçu</button></div>`).join('')}
 <div class="divider"></div><h3 class="subhead">Côté technique</h3><p class="small subtle">Cette version est une maquette : les préférences sont conservées dans ton navigateur. Neon, Gmail et DeepSeek ne sont pas appelés.</p><button class="button ghost small" onclick="resetDemo()">Restaurer les données d’exemple (50 %)</button><details class="dropdown"><summary>Crédits des photographies animalières</summary><p>Photographies issues d’Unsplash, sous licence Unsplash. Les liens sources sont indiqués ci-dessous.</p><ul>${Object.values(PHOTO).map(p=>`<li><a href="${p.link}" target="_blank" rel="noopener noreferrer">${safe(p.credit)}</a></li>`).join('')}</ul><p><a href="https://unsplash.com/license" target="_blank" rel="noopener noreferrer">Licence Unsplash</a></p></details><div class="divider"></div><button class="textbutton" onclick="go('lettre');closeModal()">Relire le mot d’anniversaire ↗</button></div>`;openModal(html)}
function setPref(k){state.prefs[k]=!state.prefs[k];persist();settings()}
function previewMail(i){openModal(`<span class="p-eyebrow">Le courrier de l’Ours · Semaine ${i+1}</span><div class="mail-preview"><h3>🐻 Une nouvelle page à remplir</h3><p>Bonjour Papa Ours,</p><p>Cette semaine, on explore <strong>${safe(weeks[i].name.toLowerCase())}</strong>. Prépare une feuille, tes feutres et un peu de curiosité.</p><p>Maman Chouette recommande la patience. Pour une fois, on va l’écouter.</p><button class="button primary small" onclick="closeModal();go('cours/${i*2}')">Voir la leçon ↗</button></div><p class="small subtle">Aperçu uniquement. Aucun email n’est envoyé depuis la maquette.</p>`)}
function resetDemo(){if(confirm('Restaurer les huit leçons, les quatre œuvres et les choix de départ ? Tes modifications locales seront perdues.')){state=structuredClone(starter);persist();closeModal();go('atelier');toast('Parcours restauré à 50 %.')}}
function openModal(html){let root=$('#modalRoot');root.innerHTML=`<div class="modal-bg" role="presentation" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="Informations"><button class="close" onclick="closeModal()" aria-label="Fermer">×</button>${html}</div></div>`;$('#modalRoot .close')?.focus()}
function closeModal(){$('#modalRoot').innerHTML=''}
window.addEventListener('hashchange',()=>{resetTimer();closeModal();renderRoute()});
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
renderRoute();
</script>
</body></html>
